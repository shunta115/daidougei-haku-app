# Loopback-only proof configuration, not suitable for public deployment.
# Based on SRS official rtc2rtmp.conf and hls.conf examples.
max_connections 1000;
daemon off;
srs_log_tank console;

rtmp {
    listen 1935;
}
http_api {
    enabled on;
    listen 1985;
}
http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}
rtc_server {
    enabled on;
    listen 8000;
    candidate 127.0.0.1;
}
vhost __defaultVhost__ {
    rtc {
        enabled on;
        rtmp_to_rtc off;
        rtc_to_rtmp on;
    }
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled on;
        hls_path ./objs/nginx/html;
        hls_fragment 4;
        hls_window 24;
        hls_recover on;
    }
}
