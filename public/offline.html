<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <title>オフライン · 大道芸博</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #050506;
        color: #f2f2f2;
        font-family: system-ui, sans-serif;
      }
      .card {
        max-width: 28rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 24px;
        background: rgba(255, 255, 255, 0.03);
      }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: rgba(255, 255, 255, 0.65); line-height: 1.5; }
      a {
        color: #2bffdd;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>オフラインです</h1>
      <p>ネットワークに接続できないため、一部の情報を表示できません。接続後にもう一度お試しください。</p>
      <a href="/">ホームへ戻る</a>
    </div>
  </body>
</html>
