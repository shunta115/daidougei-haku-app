name: Account transition database safety
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-transition-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: haku_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: haku_transition_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql/account-transition.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: haku_test
          PGPASSWORD: test_only
          PGDATABASE: haku_transition_test
  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit --module nodenext --moduleResolution nodenext --target es2022 --skipLibCheck api/ops/_hakuAdmin.ts api/ops/inbox.ts api/stripe/_shared.ts
